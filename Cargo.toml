[package]
name = "tiexiu"
version = "0.2.1-beta.1"
edition = "2024"
authors = ["Juancarlo Añez <apalala@gmail.com>"]
description = "A port of the TatSu PEG parser generator to Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neogeny/tiexiu"
readme = "README.md"
exclude = ["pyproject.toml", "__pycache__"]

[profile.release]
opt-level = 3        # Max optimizations (0-3)
lto = true           # Link Time Optimization (smaller, faster binary)
codegen-units = 1    # Better optimizations at the cost of slower build time
#panic = 'abort'      # Reduces binary size if you don't need stack unwinding
debug = true            # Required for symbols
split-debuginfo = "packed" # Force creation of a .dSYM bundle
strip = false           # Ensure symbols aren't removed

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
rustdoc-args = ["--cfg", "docsrs"]

#[lints.clippy]
#collapsible_match = "allow"

[lib]
name = "tiexiu"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tiexiu"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
bootstrap = ["default"]
grammars = []

serde = ["dep:serde"]
serde_json = [
    "dep:serde",
    "dep:serde_json",
]
cli = [
    "dep:clap",
    "dep:syntect",
    "dep:indicatif",
    "regex",
]
pyo3 = ["dep:pyo3", "cli"]
regex = ["dep:regex"]


#interpolation = ["dep:strfmt", "dep:evalexpr"]

[dependencies]
indexmap = "2.13"
thiserror = "2.0"
console = "0.16"
json = "0.12"

pyo3 = {
    version = "0.29",
    features = ["extension-module", "abi3-py312", "generate-import-lib"],
    optional = true
}

clap = { version = "4.6", features = ["derive"], optional = true }
syntect = { version = "5.3.0", optional = true }

serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
unicode-width = "0.2"
derivative = "2.2"
indicatif = { version = "0.18", optional = true }
ahash = { version = "0.8", features = ["no-rng", "std"] }
regex = { version = "1.12", optional = true }
quick_cache = "0.7.0"

#evalexpr = { version = "13.1.0", optional = true }
#strfmt = { version = "0.2.5", optional = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = ">=0.6"

[dev-dependencies]
criterion = { version = "4.4", package = "codspeed-criterion-compat" }

[[bench]]
name = "parsing"
harness = false
